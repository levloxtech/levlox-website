<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <section class="thank-you-section">
        <div class="thank-you-container">
            <!-- Custom Close Button -->
            <button class="close-btn" aria-label="Close thank you message"></button>
            
            <div class="thank-you-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 class="thank-you-title">Thank You!</h1>
            <p class="thank-you-text">
                Your submission has been received. We'll review your information and get back to you within 24-48 hours.
            </p>
            <p class="thank-you-text">
                In the meantime, feel free to explore more of our work or get in touch if you have any immediate questions.
            </p>
            
            <div class="action-buttons">
                <a href="http://192.168.66.184:5500/levlox/index.html" class="btn btn-primary">Return Home</a>
                <a href="/contact" class="btn btn-outline">Contact Us</a>
            </div>
            
            <div class="social-links">
                <a href="https://instagram.com/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://dribbble.com/" aria-label="Dribbble"><i class="fab fa-dribbble"></i></a>
                <a href="https://linkedin.com/company/" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://twitter.com/" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </section>

    <style>
        /* Base Styles */
        :root {
            --primary: #000000;
            --secondary: #f5f5f5;
            --accent: #1ec14f;
            --text: #333333;
            --light-text: #777777;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--secondary);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* Thank You Section */
        .thank-you-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            position: relative;
        }
        
        .thank-you-container {
            max-width: 680px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 4rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        /* Close Button Styles */
        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        
        .close-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        
        .close-btn::before, 
        .close-btn::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background-color: var(--light-text);
            transition: all 0.3s ease;
        }
        
        .close-btn::before {
            transform: rotate(45deg);
        }
        
        .close-btn::after {
            transform: rotate(-45deg);
        }
        
        .close-btn:hover::before,
        .close-btn:hover::after {
            background-color: red;
            transform: rotate(0deg);
        }
        
        .close-btn:hover::before {
            transform: translateY(1px) rotate(45deg) scaleX(1.1);
        }
        
        .close-btn:hover::after {
            transform: translateY(-1px) rotate(-45deg) scaleX(1.1);
        }
        
        /* Rest of your existing styles... */
        .thank-you-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            animation: bounce 1s ease;
        }
        
        .thank-you-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        
        .thank-you-text {
            font-size: 1.1rem;
            color: var(--light-text);
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }
        
        .social-links {
            margin-top: 3rem;
        }
        
        .social-links a {
            display: inline-block;
            margin: 0 0.75rem;
            color: var(--light-text);
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .social-links a:hover {
            color: var(--accent);
            transform: translateY(-3px);
        }
        
        /* Animations */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .thank-you-title {
                font-size: 2rem;
            }
            
            .thank-you-text {
                font-size: 1rem;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            .btn {
                width: 100%;
            }
            
            .close-btn {
                top: 16px;
                right: 16px;
                width: 36px;
                height: 36px;
            }
        }
    </style>
    <script>
        // Animation on load
        document.addEventListener('DOMContentLoaded', function() {
            // Add slight delay for animation
            setTimeout(function() {
                document.querySelector('.thank-you-container').style.opacity = '1';
                document.querySelector('.thank-you-container').style.transform = 'translateY(0)';
            }, 100);
            
            // Close button functionality
            document.querySelector('.close-btn').addEventListener('click', function() {
                // For a standalone page, redirect to home
                window.location.href = 'http://192.168.66.184:5500/levlox/index.html';
                
                /* If this is a modal, use this instead:
                document.querySelector('.thank-you-section').style.display = 'none';
                */
            });
        });

        // Track thank you page view (replace with your analytics code)
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'GA_MEASUREMENT_ID');
        // Close button functionality
document.querySelector('.close-btn').addEventListener('click', function() {
    // For a standalone page, redirect to home
    window.location.href = '';
    
    /* If this is a modal, use this instead:
    document.querySelector('.thank-you-section').style.display = 'none';
    */
});
    </script>
    
</body>
</html>
